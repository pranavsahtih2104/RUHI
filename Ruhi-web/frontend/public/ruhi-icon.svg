<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="ruhiGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    <linearGradient id="ruhiGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer intelligent orbital ring -->
  <circle cx="60" cy="60" r="52" stroke="url(#ruhiGrad2)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>
  
  <!-- Geometric neural quadrant arcs -->
  <path d="M 60 20 A 40 40 0 0 1 100 60" stroke="url(#ruhiGrad1)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 60 100 A 40 40 0 0 1 20 60" stroke="url(#ruhiGrad1)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Inner diamond core -->
  <polygon points="60,35 85,60 60,85 35,60" stroke="url(#ruhiGrad1)" stroke-width="2" fill="url(#ruhiGrad2)" fill-opacity="0.1" />
  
  <!-- Intelligent focal node -->
  <circle cx="60" cy="60" r="8" fill="url(#ruhiGrad1)" filter="url(#glow)"/>
  <circle cx="60" cy="60" r="3" fill="#FFFFFF"/>
</svg>
